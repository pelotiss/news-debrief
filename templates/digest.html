<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen matutino — {date}</title>
<style>
  body {{
    max-width: 40em;
    margin: 2em auto;
    padding: 0 1.2em;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.6;
    color: #111;
    background: #fdfdfb;
  }}
  h1 {{
    font-size: 1.3em;
    border-bottom: 1px solid #ccc;
    padding-bottom: 0.4em;
    margin-bottom: 0.2em;
  }}
  h2 {{
    font-size: 1.05em;
    margin-top: 1.6em;
    margin-bottom: 0.6em;
  }}
  .date {{
    color: #555;
    font-size: 0.85em;
    margin-bottom: 1.5em;
  }}
  a {{
    color: #111;
    text-decoration: underline;
  }}
  p, li {{
    margin-bottom: 1em;
  }}
  .local {{
    background: #f6f2e9;
    border-left: 3px solid #b5651d;
    padding: 0.8em 1em;
    margin: 1em 0 1.5em;
  }}
  .local h2 {{
    margin-top: 0;
  }}
  .missing {{
    margin-top: 3em;
    padding-top: 1em;
    border-top: 1px solid #ccc;
    font-size: 0.8em;
    color: #777;
  }}
  .missing h2 {{
    font-size: 1em;
    border-bottom: none;
  }}
</style>
</head>
<body>
<h1>Resumen matutino</h1>
<div class="date">{date}</div>
{content}
</body>
</html>
